apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: web-rs
  namespace: k8s-practice
spec:
  replicas: 3


  selector:
    matchLabels:
      app: web-rs


  template:
    metadata:
      labels:
        app: web-rs

    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
    