apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  namespace: k8s-practice

spec:
  replicas: 3

  selector:
    matchLabels:
      app: web-deployment

  template:
    metadata:
      labels:
        app: web-deployment

    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: web-config
            - secretRef:
                name: web-secret
          startupProbe:
            httpGet:
              path: /
              port: 80
            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"

            limits:
              cpu: "200m"
              memory: "128Mi"

          volumeMounts:
            - name: web-storage
              mountPath: /usr/share/nginx/html/data

      volumes:
      - name: web-storage
        persistentVolumeClaim:
          claimName: web-pvc