apiVersion: networking.k8s.io/v1
kind: Ingress


metadata:
  name: web-ingress
  namespace: k8s-practice

spec:
  ingressClassName: nginx


  rules:
    - host: web.local
      http:
       paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: web-service
              port:
                number: 80